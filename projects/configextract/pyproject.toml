[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "configextract"
version = "0.1.0"
description = "Link YARA extraction rules to malware config decoders"
requires-python = ">=3.10"
dependencies = [
    "yara-python>=4.3",
]

[project.optional-dependencies]
pe = ["pefile>=2023.2.7"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
